aid: silabs
name: Silicon Labs
description: 'Silicon Labs (Silabs) is a fabless semiconductor company headquartered
  in Austin, Texas that designs silicon, software, and solutions for a more connected,
  IoT world. Its portfolio includes wireless connectivity SoCs and modules for Bluetooth,
  Bluetooth Mesh, Zigbee, Thread, Matter, Z-Wave, Wi-Fi, and proprietary sub-GHz protocols,
  along with 32-bit microcontrollers, sensors, and timing devices. Developers build
  on Silicon Labs hardware using the Simplicity Studio IDE, the Simplicity SDK (formerly
  Gecko SDK), the docs.silabs.com developer documentation, and the Silicon Labs Community.
  Silicon Labs is a hardware and embedded-software provider rather than a web-API vendor:
  its public developer surface is embedded C/C++ SDKs, tools, and reference examples
  on GitHub (github.com/SiliconLabs), not a hosted REST API — so this profile carries
  identity, developer-portal, and security signals rather than API specifications.'
